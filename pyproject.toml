[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tdqeq"
version = "0.1.0"
description = "A powerful PDF table detection and extraction pipeline."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Tdqeq Contributors" }
]
dependencies = [
    "rapid_table>=0.1.0",
    "rapidocr_onnxruntime>=1.3.0",
    "doclayout_yolo>=0.0.2",
    "PyMuPDF>=1.22.0",
    "beautifulsoup4>=4.12.0",
    "loguru>=0.7.0",
    "huggingface-hub>=0.14.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.21.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "pandas>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = ["E501"] # Ignore line-too-long (we use black/ruff formatter)

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[project.scripts]
tdqeq = "tdqeq.main:main"
tdqeq-mcp = "tdqeq.mcp_server:main"
